name: SOC 2 Guardian tests
on:
  push:
    paths:
      - 'skills/soc2-engineering-guardian/**'
      - 'docs/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'skills/soc2-engineering-guardian/**'
      - 'docs/**'
      - '.github/workflows/tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/soc2-engineering-guardian/tests -v
      - run: python docs/build_example.py
